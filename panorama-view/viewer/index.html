<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>360 panorama viewer</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="vendor/pannellum.css">
  <link rel="stylesheet" href="viewer.css">
  <script src="vendor/pannellum.js" defer></script>
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <header>
    <h1>360 panorama viewer</h1>
    <div class="examples">
      <button id="reference" type="button">Reference sphere</button>
      <button id="synthetic" type="button">Phase 2 synthetic</button>
      <span>Test images, not room photographs.</span>
    </div>
    <form id="open-files">
      <label>Panorama JPEG <input id="image-file" type="file" accept="image/jpeg,.jpg,.jpeg" required></label>
      <label>Metadata JSON <input id="metadata-file" type="file" accept="application/json,.json" required></label>
      <button type="submit">Open panorama</button>
    </form>
    <p id="status" role="status" aria-live="polite" data-state="idle">Choose a test image or a JPEG and its metadata. Files stay on this device.</p>
    <p class="hint">Drag left or right to look around. Scroll, pinch, or use + / − to zoom.</p>
  </header>
  <main id="panorama" aria-label="Interactive panorama" aria-busy="false"></main>
  <noscript>JavaScript and WebGL are required for the panorama viewer.</noscript>
</body>
</html>
